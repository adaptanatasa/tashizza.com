<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OG galerija | Ljubavno pismo učenju</title>

  <link rel="icon"
        type="image/x-icon"
        href="../../../img/ui/favicon.ico">

  <link href="../../../css/style.css"
        rel="stylesheet">
</head>

<body class="reading-page">

  <main class="reading-card og-gallery-card">

    <h1>OG galerija</h1>

    <p class="og-gallery-note">
      Ilustracije za ovu knjigu nastale su u saradnji autora i ChatGPT-a.
    </p>

    <p class="og-gallery-note">
      Za preuzimanje slike koristite desni klik → <em>Save Image As…</em>
    </p>

    <img id="gallery-image"
         class="og-gallery-image"
         src=""
         alt="OG slika">

    <div class="og-gallery-actions">
      <button id="prev-image"
              class="close-btn"
              type="button">
        ← Prethodna
      </button>

      <button id="close-gallery"
              class="close-btn"
              type="button">
        Zatvori
      </button>

      <button id="next-image"
              class="close-btn"
              type="button">
        Sledeća →
      </button>
    </div>

  </main>

  <script>
    const folder = "../../../img/biblioteke/caskanje/ljubavno-pismo-ucenju/og/";

    const images = [
  "og-ljubavno-pismo-ucenju.png",

  "og-01-vilijam-okam.png",
  "og-02-hanlonova-britva.png",
  "og-03-kurt-gedel.png",
  "og-04-tomas-kun.png",
  "og-05-mentalne-zamke.png",
  "og-06-dzon-nes.png",
  "og-07-zatvorenikova-dilema.png",
  "og-08-pareto.png",
  "og-09-parkinsonov-zakon.png",
  "og-10-donosenje-odluka.png",
  "og-11-lorenc.png",
  "og-12-taleb.png",
  "og-13-sredinger.png",
  "og-14-zadeh.png",
  "og-15-neizvesnost.png",
  "og-16-maslov.png",
  "og-17-pavlov.png",
  "og-18-daning-kruger.png",
  "og-19-rombah.png",
  "og-20-ljudi-i-teorije.png",
  "og-21-tjuring.png",
  "og-22-viner.png",
  "og-23-fon-nojman.png",
  "og-24-rasel-i-norvig.png",
  "og-25-ai-kao-ekosistem.png",

  "og-26-charles-babbage.png",
  "og-27-ada-lovelace.png",
  "og-28-alan-tjuring.png",
  "og-29-dzon-fon-nojman.png",
  "og-30-claude-shannon.png",
  "og-31-grace-hopper.png",
  "og-32-ken-thompson.png",
  "og-33-dennis-ritchie.png",
  "og-34-richard-stallman.png",
  "og-35-linus-torvalds.png",
  "og-36-tim-berners-lee.png",
  "og-37-larry-wall.png",
  "og-38-guido-van-rossum.png",
  "og-39-bjarne-stroustrup.png",
  "og-40-james-gosling.png",
  "og-41-apache.png",
  "og-42-rasmus-lerdorf.png",
  "og-43-michael-widenius-i-david-axmark.png",
  "og-44-michael-stonebraker.png",
  "og-45-jimmy-wales.png",
  "og-46-douglas-engelbart.png",
  "og-47-newell-i-simon.png",
  "og-48-zadeh.png",
  "og-49-dzon-nes.png",
  "og-50-rasel-i-norvig.png",

  "og-z01-vilijam-okam.png",
  "og-z03-kurt-gedel.png",
  "og-z04-tomas-kun.png",
  "og-z08-pareto.png",
  "og-z09-parkinson.png",
  "og-z11-lorenc.png",
  "og-z12-taleb.png",
  "og-z13-sredinger.png",
  "og-z16-maslov.png",
  "og-z17-pavlov.png",
  "og-z18-daning.png",
  "og-z18-kruger.png",
  "og-z19-rombah.png",
  "og-z22-viner.png"
];
    const params = new URLSearchParams(window.location.search);
    const requestedImage = params.get("img");

    let currentIndex = images.indexOf(requestedImage);

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const galleryImage = document.getElementById("gallery-image");
    const prevBtn = document.getElementById("prev-image");
    const nextBtn = document.getElementById("next-image");
    const closeBtn = document.getElementById("close-gallery");

    function showImage() {
      galleryImage.src = folder + images[currentIndex];
      galleryImage.alt = images[currentIndex];
    }

    prevBtn.addEventListener("click", function () {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    nextBtn.addEventListener("click", function () {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });

    closeBtn.addEventListener("click", function () {
      window.close();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }

      if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }

      if (event.key === "Escape") {
        window.close();
      }
    });

    showImage();
  </script>

</body>
</html>
