<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OG galerija | VMware Tanzu</title>

  <link rel="icon"
        type="image/x-icon"
        href="../../../../img/ui/favicon.ico">

  <link href="../../../../css/style.css"
        rel="stylesheet">
</head>

<body class="reading-page">

  <main class="reading-card og-gallery-card">

    <h1>OG galerija</h1>

    <p class="og-gallery-note">
      Ilustracije za ovaj tutorijal nastale su u saradnji autora i ChatGPT-a.
    </p>

    <p class="og-gallery-note">
      Za preuzimanje slike koristite desni klik → <em>Save Image As…</em>
    </p>

    <img id="gallery-image"
         class="og-gallery-image"
         src=""
         alt="OG slika">

    <div class="og-gallery-actions">
      <button id="prev-image"
              class="close-btn"
              type="button">
        ← Prethodna
      </button>

      <button id="close-gallery"
              class="close-btn"
              type="button">
        Zatvori
      </button>

      <button id="next-image"
              class="close-btn"
              type="button">
        Sledeća →
      </button>
    </div>

  </main>

  <script>
    const folder =
      "../../../../img/biblioteke/tutorijali/devops-platforme/vmware-tanzu/og/";

    const images = [
      "og-vmware-tanzu.png",
      "og-vmware-tanzu-uvod.png",

      "og-vmware-tanzu-01-sta-je-vmware-tanzu.png",
      "og-vmware-tanzu-02-zasto-uciti-vmware-tanzu.png",
      "og-vmware-tanzu-03-od-vm-do-kontejnera.png",
      "og-vmware-tanzu-04-sta-je-kubernetes-u-tanzu.png",
      "og-vmware-tanzu-05-tanzu-ekosistem.png",
      "og-vmware-tanzu-06-vsphere-kao-osnova.png",
      "og-vmware-tanzu-07-vcenter-i-tanzu.png",
      "og-vmware-tanzu-08-supervisor-cluster.png",
      "og-vmware-tanzu-09-workload-cluster.png",
      "og-vmware-tanzu-10-namespace-i-resursi.png",
      "og-vmware-tanzu-11-pod.png",
      "og-vmware-tanzu-12-deployment.png",
      "og-vmware-tanzu-13-service.png",
      "og-vmware-tanzu-14-ingress.png",
      "og-vmware-tanzu-15-configmap-secret.png",
      "og-vmware-tanzu-16-tkg.png",
      "og-vmware-tanzu-17-management-cluster.png",
      "og-vmware-tanzu-18-workload-cluster-kreiranje.png",
      "og-vmware-tanzu-19-node-pool.png",
      "og-vmware-tanzu-20-upgrade-klastera.png",
      "og-vmware-tanzu-21-kontejner.png",
      "og-vmware-tanzu-22-container-image.png",
      "og-vmware-tanzu-23-registry.png",
      "og-vmware-tanzu-24-deploy-aplikacije.png",
      "og-vmware-tanzu-25-rollback.png",
      "og-vmware-tanzu-26-tanzu-mreze.png",
      "og-vmware-tanzu-27-load-balancer.png",
      "og-vmware-tanzu-28-network-policy.png",
      "og-vmware-tanzu-29-persistent-volume.png",
      "og-vmware-tanzu-30-storage-class.png",
      "og-vmware-tanzu-31-rbac.png",
      "og-vmware-tanzu-32-image-security.png",
      "og-vmware-tanzu-33-secrets.png",
      "og-vmware-tanzu-34-cicd.png",
      "og-vmware-tanzu-35-gitops.png",
      "og-vmware-tanzu-36-monitoring.png",
      "og-vmware-tanzu-37-logovi.png",
      "og-vmware-tanzu-38-troubleshooting.png",
      "og-vmware-tanzu-39-mini-projekat-lab.png",
      "og-vmware-tanzu-40-mini-projekat-modernizacija.png",

      "og-vmware-tanzu-zakljucak.png"
    ];

    const params = new URLSearchParams(window.location.search);
    const requestedImage = params.get("img");

    let currentIndex = images.indexOf(requestedImage);

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const galleryImage = document.getElementById("gallery-image");
    const prevBtn = document.getElementById("prev-image");
    const nextBtn = document.getElementById("next-image");
    const closeBtn = document.getElementById("close-gallery");

    function showImage() {
      galleryImage.src = folder + images[currentIndex];
      galleryImage.alt = images[currentIndex];
    }

    prevBtn.addEventListener("click", function () {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    nextBtn.addEventListener("click", function () {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });

    closeBtn.addEventListener("click", function () {
      window.close();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }

      if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }

      if (event.key === "Escape") {
        window.close();
      }
    });

    showImage();
  </script>

</body>
</html>
