<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OG galerija | VMware</title>

  <link rel="icon"
        type="image/x-icon"
        href="../../../../img/ui/favicon.ico">

  <link href="../../../../css/style.css"
        rel="stylesheet">
</head>

<body class="reading-page">

  <main class="reading-card og-gallery-card">

    <h1>OG galerija</h1>

    <p class="og-gallery-note">
      Ilustracije za ovaj tutorijal nastale su u saradnji autora i ChatGPT-a.
    </p>

    <p class="og-gallery-note">
      Za preuzimanje slike koristite desni klik → <em>Save Image As…</em>
    </p>

    <img id="gallery-image"
         class="og-gallery-image"
         src=""
         alt="OG slika">

    <div class="og-gallery-actions">
      <button id="prev-image"
              class="close-btn"
              type="button">
        ← Prethodna
      </button>

      <button id="close-gallery"
              class="close-btn"
              type="button">
        Zatvori
      </button>

      <button id="next-image"
              class="close-btn"
              type="button">
        Sledeća →
      </button>
    </div>

  </main>

  <script>
    const folder =
      "../../../../img/biblioteke/tutorijali/devops-platforme/vmware/og/";

    const images = [
      "og-vmware.png",
      "og-vmware-uvod.png",

      "og-vmware-01-sta-je-vmware.png",
      "og-vmware-02-zasto-uciti-vmware.png",
      "og-vmware-03-sta-je-virtuelizacija.png",
      "og-vmware-04-hipervizor.png",
      "og-vmware-05-vmware-ekosistem.png",
      "og-vmware-06-esxi-host.png",
      "og-vmware-07-vcenter.png",
      "og-vmware-08-vsphere-client.png",
      "og-vmware-09-datacenter-cluster-host.png",
      "og-vmware-10-resource-pool.png",
      "og-vmware-11-virtuelna-masina.png",
      "og-vmware-12-kreiranje-vm.png",
      "og-vmware-13-vm-hardware.png",
      "og-vmware-14-vmware-tools.png",
      "og-vmware-15-template-i-kloniranje.png",
      "og-vmware-16-power-operacije.png",
      "og-vmware-17-snapshot.png",
      "og-vmware-18-konverzija-template.png",
      "og-vmware-19-migracija-vm.png",
      "og-vmware-20-osnovni-troubleshooting-vm.png",
      "og-vmware-21-virtual-switch.png",
      "og-vmware-22-port-group.png",
      "og-vmware-23-vlan.png",
      "og-vmware-24-vmkernel-adapter.png",
      "og-vmware-25-debug-mreze.png",
      "og-vmware-26-datastore.png",
      "og-vmware-27-vmdk.png",
      "og-vmware-28-thin-thick-provisioning.png",
      "og-vmware-29-nfs-iscsi-fc.png",
      "og-vmware-30-storage-troubleshooting.png",
      "og-vmware-31-vmotion.png",
      "og-vmware-32-high-availability.png",
      "og-vmware-33-drs.png",
      "og-vmware-34-performanse.png",
      "og-vmware-35-sigurnost.png",
      "og-vmware-36-backup-i-restore.png",
      "og-vmware-37-monitoring-i-logovi.png",
      "og-vmware-38-troubleshooting.png",
      "og-vmware-39-inventar-tagovi-cmdb.png",
      "og-vmware-40-priprema-za-kubernetes-platforme.png",

      "og-vmware-dodatak-1-laboratorijsko-okruzenje.png",
      "og-vmware-dodatak-2-mini-projekat-enterprise-okruzenje.png",

      "og-vmware-zakljucak.png"
    ];

    const params = new URLSearchParams(window.location.search);
    const requestedImage = params.get("img");

    let currentIndex = images.indexOf(requestedImage);

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const galleryImage = document.getElementById("gallery-image");
    const prevBtn = document.getElementById("prev-image");
    const nextBtn = document.getElementById("next-image");
    const closeBtn = document.getElementById("close-gallery");

    function showImage() {
      galleryImage.src = folder + images[currentIndex];
      galleryImage.alt = images[currentIndex];
    }

    prevBtn.addEventListener("click", function () {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    nextBtn.addEventListener("click", function () {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });

    closeBtn.addEventListener("click", function () {
      window.close();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }

      if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }

      if (event.key === "Escape") {
        window.close();
      }
    });

    showImage();
  </script>

</body>
</html>
