<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OG galerija | Vanilla Kubernetes</title>

  <link rel="icon"
        type="image/x-icon"
        href="../../../../img/ui/favicon.ico">

  <link href="../../../../css/style.css"
        rel="stylesheet">
</head>

<body class="reading-page">

  <main class="reading-card og-gallery-card">

    <h1>OG galerija</h1>

    <p class="og-gallery-note">
      Ilustracije za ovaj tutorijal nastale su u saradnji autora i ChatGPT-a.
    </p>

    <p class="og-gallery-note">
      Za preuzimanje slike koristite desni klik → <em>Save Image As…</em>
    </p>

    <img id="gallery-image"
         class="og-gallery-image"
         src=""
         alt="OG slika">

    <div class="og-gallery-actions">
      <button id="prev-image"
              class="close-btn"
              type="button">
        ← Prethodna
      </button>

      <button id="close-gallery"
              class="close-btn"
              type="button">
        Zatvori
      </button>

      <button id="next-image"
              class="close-btn"
              type="button">
        Sledeća →
      </button>
    </div>

  </main>

  <script>
    const folder =
      "../../../../img/biblioteke/tutorijali/devops-platforme/vanilla-k8s/og/";

    const images = [
      "og-vanilla-k8s.png",
      "og-vanilla-k8s-uvod.png",

      "og-vanilla-k8s-01-sta-je-vanilla-kubernetes.png",
      "og-vanilla-k8s-02-zasto-uciti-vanilla-k8s.png",
      "og-vanilla-k8s-03-kontejneri-i-orkestracija.png",
      "og-vanilla-k8s-04-kubernetes-ekosistem.png",
      "og-vanilla-k8s-05-lokalni-i-lab-klasteri.png",
      "og-vanilla-k8s-06-control-plane.png",
      "og-vanilla-k8s-07-worker-node.png",
      "og-vanilla-k8s-08-api-server.png",
      "og-vanilla-k8s-09-etcd.png",
      "og-vanilla-k8s-10-scheduler-i-controlleri.png",
      "og-vanilla-k8s-11-kubectl-osnove.png",
      "og-vanilla-k8s-12-kubeconfig.png",
      "og-vanilla-k8s-13-get-describe-logs.png",
      "og-vanilla-k8s-14-apply-delete-edit.png",
      "og-vanilla-k8s-15-yaml-manifesti.png",
      "og-vanilla-k8s-16-pod.png",
      "og-vanilla-k8s-17-replicaset.png",
      "og-vanilla-k8s-18-deployment.png",
      "og-vanilla-k8s-19-service.png",
      "og-vanilla-k8s-20-namespace.png",
      "og-vanilla-k8s-21-clusterip-nodeport-loadbalancer.png",
      "og-vanilla-k8s-22-dns-u-klasteru.png",
      "og-vanilla-k8s-23-ingress.png",
      "og-vanilla-k8s-24-network-policy.png",
      "og-vanilla-k8s-25-debug-mreze.png",
      "og-vanilla-k8s-26-configmap.png",
      "og-vanilla-k8s-27-secret.png",
      "og-vanilla-k8s-28-volume.png",
      "og-vanilla-k8s-29-persistent-volume.png",
      "og-vanilla-k8s-30-statefulset.png",
      "og-vanilla-k8s-31-rbac.png",
      "og-vanilla-k8s-32-service-account.png",
      "og-vanilla-k8s-33-liveness-readiness-startup.png",
      "og-vanilla-k8s-34-requests-limits.png",
      "og-vanilla-k8s-35-rollout-rollback.png",
      "og-vanilla-k8s-36-skaliranje.png",
      "og-vanilla-k8s-37-monitoring-i-logovi.png",
      "og-vanilla-k8s-38-troubleshooting.png",
      "og-vanilla-k8s-39-inventar-labels-annotations.png",
      "og-vanilla-k8s-40-priprema-za-kubernetes-distribucije.png",

      "og-vanilla-k8s-dodatak-1-laboratorijsko-okruzenje.png",
      "og-vanilla-k8s-dodatak-2-mini-projekat-enterprise-okruzenje.png",
      "og-vanilla-k8s-dodatak-3-infrastrukturne-laboratorije-devops-obuka.png",
      "og-vanilla-k8s-dodatak-4-vK8s-na-vmware-komplet-lab-devops-obuka.png",

      "og-vanilla-k8s-zakljucak.png"
    ];

    const params = new URLSearchParams(window.location.search);
    const requestedImage = params.get("img");

    let currentIndex = images.indexOf(requestedImage);

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const galleryImage = document.getElementById("gallery-image");
    const prevBtn = document.getElementById("prev-image");
    const nextBtn = document.getElementById("next-image");
    const closeBtn = document.getElementById("close-gallery");

    function showImage() {
      galleryImage.src = folder + images[currentIndex];
      galleryImage.alt = images[currentIndex];
    }

    prevBtn.addEventListener("click", function () {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    nextBtn.addEventListener("click", function () {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });

    closeBtn.addEventListener("click", function () {
      window.close();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }

      if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }

      if (event.key === "Escape") {
        window.close();
      }
    });

    showImage();
  </script>

</body>
</html>
